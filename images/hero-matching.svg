<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" role="img" aria-label="Three students connected to a team. Two of them have the skills the team needs.">
  <defs>
    <linearGradient id="avatarGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231B48"/>
      <stop offset="1" stop-color="#101629"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <style>
      .line { stroke: url(#lineGradient); stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.2s ease-out 0.3s forwards; }
      .line-weak { stroke: rgba(255, 255, 255, 0.25); stroke-width: 2; fill: none; stroke-dasharray: 5 8; }
      .chip { fill: rgba(255, 255, 255, 0.06); stroke: rgba(255, 255, 255, 0.25); }
      .chip-match { fill: rgba(6, 182, 212, 0.2); stroke: #06B6D4; }
      .label { font-family: Outfit, "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #E2E8F0; }
      .name { font-family: Outfit, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #F8FAFC; }
      .title { font-family: Outfit, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #F8FAFC; }
      .small { font-family: Outfit, "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #AAB4CB; }
      .ring { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-dasharray: 3 7; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .line { animation: none; stroke-dashoffset: 0; } }
    </style>
  </defs>

  <!-- Soft light and rings in the background -->
  <circle cx="260" cy="215" r="200" fill="url(#glow)"/>
  <circle class="ring" cx="260" cy="215" r="150"/>
  <circle class="ring" cx="260" cy="215" r="200"/>

  <!-- Connections from students to the team -->
  <path class="line" d="M118 118 C 170 150, 190 170, 205 178"/>
  <path class="line" d="M402 150 C 360 165, 340 175, 318 185"/>
  <path class="line-weak" d="M128 318 C 170 300, 190 280, 210 262"/>

  <!-- Team card -->
  <rect x="150" y="165" width="220" height="112" rx="16" fill="url(#cardGradient)" stroke="rgba(168, 85, 247, 0.55)" stroke-width="1.5"/>
  <text class="title" x="168" y="203">Smart Campus App</text>
  <text class="small" x="168" y="224">Needs</text>
  <rect class="chip-match" x="168" y="234" width="78" height="26" rx="13"/>
  <text class="label" x="207" y="251" text-anchor="middle">Back-end</text>
  <rect class="chip-match" x="252" y="234" width="104" height="26" rx="13"/>
  <text class="label" x="304" y="251" text-anchor="middle">UI/UX Design</text>

  <!-- Student 1 (matched) -->
  <circle cx="92" cy="96" r="34" fill="url(#avatarGradient)"/>
  <circle cx="92" cy="86" r="11" fill="#FFFFFF"/>
  <path d="M72 116 a20 16 0 0 1 40 0" fill="#FFFFFF"/>
  <circle cx="118" cy="70" r="11" fill="#10B981"/>
  <path d="M113 70 l4 4 l7 -8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text class="name" x="92" y="150" text-anchor="middle">Hind</text>
  <rect class="chip-match" x="52" y="158" width="80" height="24" rx="12"/>
  <text class="label" x="92" y="174" text-anchor="middle">Back-end</text>

  <!-- Student 2 (matched) -->
  <circle cx="436" cy="140" r="34" fill="url(#avatarGradient)"/>
  <circle cx="436" cy="130" r="11" fill="#FFFFFF"/>
  <path d="M416 160 a20 16 0 0 1 40 0" fill="#FFFFFF"/>
  <circle cx="462" cy="114" r="11" fill="#10B981"/>
  <path d="M457 114 l4 4 l7 -8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text class="name" x="436" y="194" text-anchor="middle">Lama</text>
  <rect class="chip-match" x="384" y="202" width="104" height="24" rx="12"/>
  <text class="label" x="436" y="218" text-anchor="middle">UI/UX Design</text>

  <!-- Student 3 (not matched) -->
  <circle cx="104" cy="336" r="30" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)"/>
  <circle cx="104" cy="327" r="10" fill="#AAB4CB"/>
  <path d="M86 354 a18 14 0 0 1 36 0" fill="#AAB4CB"/>
  <text class="name" x="104" y="386" text-anchor="middle">Maha</text>
  <rect class="chip" x="56" y="394" width="96" height="24" rx="12"/>
  <text class="label" x="104" y="410" text-anchor="middle">Data Analysis</text>
</svg>
