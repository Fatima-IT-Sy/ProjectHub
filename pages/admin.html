<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | ProjectHub</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main>
    <div class="container">
      <div class="page-header">
        <h1>Admin dashboard</h1>
        <p>Monitor the students and teams on ProjectHub, and remove fake or inappropriate ones.</p>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="ph-card stat-card">
            <span class="icon-box"><i class="bi bi-person-lines-fill"></i></span>
            <span><span class="number d-block" id="studentsCount">0</span><span class="meta">Registered students</span></span>
          </div>
        </div>
        <div class="col-md-4">
          <div class="ph-card stat-card">
            <span class="icon-box"><i class="bi bi-people"></i></span>
            <span><span class="number d-block" id="teamsCount">0</span><span class="meta">Teams</span></span>
          </div>
        </div>
        <div class="col-md-4">
          <div class="ph-card stat-card">
            <span class="icon-box"><i class="bi bi-envelope"></i></span>
            <span><span class="number d-block" id="requestsCount">0</span><span class="meta">Pending join requests</span></span>
          </div>
        </div>
      </div>

      <ul class="nav ph-tabs mb-4" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="studentsTab" data-bs-toggle="tab" data-bs-target="#studentsPanel" type="button" role="tab">
            <i class="bi bi-person-lines-fill me-1"></i>Students
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="teamsTab" data-bs-toggle="tab" data-bs-target="#teamsPanel" type="button" role="tab">
            <i class="bi bi-people me-1"></i>Teams
          </button>
        </li>
      </ul>

      <div class="tab-content mb-5">
        <div class="tab-pane fade show active" id="studentsPanel" role="tabpanel">
          <div id="studentsList"></div>
        </div>
        <div class="tab-pane fade" id="teamsPanel" role="tabpanel">
          <div id="teamsList"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="ph-footer">
    <span>ProjectHub &copy; 2026</span>
    <a class="footer-email" href="mailto:projecthub@outlook.sa"><i class="bi bi-envelope"></i>projecthub@outlook.sa</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    setupAdminPage();
  </script>
</body>
</html>
