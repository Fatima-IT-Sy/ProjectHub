<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team | ProjectHub</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main id="pageContent">
    <div class="container py-4">
      <a class="d-inline-block mb-3" href="search-teams.html"><i class="bi bi-arrow-left me-1"></i>Back to teams</a>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="ph-card">
            <div id="teamType"></div>
            <h1 class="mt-3 mb-1" id="teamTitle"></h1>
            <p class="meta">Created by <span id="teamCreator"></span></p>

            <div class="info-block mt-4">
              <div class="card-title-row"><span class="icon-box"><i class="bi bi-card-text"></i></span><h2>About this team</h2></div>
              <p id="teamDescription" class="mb-0"></p>
            </div>
            <div class="info-block">
              <div class="card-title-row"><span class="icon-box"><i class="bi bi-tools"></i></span><h2>Required skills</h2></div>
              <div id="teamSkills"></div>
            </div>
            <div class="info-block">
              <div class="card-title-row"><span class="icon-box"><i class="bi bi-briefcase"></i></span><h2>Open positions</h2></div>
              <div id="teamPositions"></div>
            </div>
            <p class="form-text mb-0"><span class="tag tag-match">Highlighted tags</span> match the skills and roles in your profile.</p>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="ph-card mb-4" id="teamActions"></div>
          <div class="ph-card">
            <div class="card-title-row"><span class="icon-box"><i class="bi bi-people"></i></span><h2>Members (<span id="membersCount">0</span>)</h2></div>
            <div id="teamMembers"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="ph-footer">
    <span>ProjectHub &copy; 2026</span>
    <a class="footer-email" href="mailto:projecthub@outlook.sa"><i class="bi bi-envelope"></i>projecthub@outlook.sa</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/teams.js"></script>
  <script src="../js/requests.js"></script>
  <script>
    setupViewTeamPage();
  </script>
</body>
</html>
