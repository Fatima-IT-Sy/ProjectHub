<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My profile | ProjectHub</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main id="pageContent">
    <div class="container py-4">
      <!-- Profile view -->
      <div id="viewSection">
        <div class="ph-card mb-4">
          <div class="profile-header">
            <span class="avatar avatar-lg" id="profileAvatar"></span>
            <div class="flex-grow-1">
              <h1 id="profileName"></h1>
              <div class="meta"><i class="bi bi-envelope me-1"></i>Email: <span id="profileEmail"></span></div>
              <div class="profile-stats">
                <span><i class="bi bi-people me-1"></i><strong id="teamsCount">0</strong> team(s)</span>
                <span><i class="bi bi-send me-1"></i><strong id="requestsCount">0</strong> request(s) sent</span>
              </div>
            </div>
            <div id="ownerActions">
              <button class="btn btn-primary" id="editButton"><i class="bi bi-pencil me-1"></i>Edit profile</button>
            </div>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-lg-7">
            <div class="ph-card h-100">
              <div class="info-block">
                <div class="card-title-row"><span class="icon-box"><i class="bi bi-tools"></i></span><h2>Skills</h2></div>
                <div id="profileSkills"></div>
              </div>
              <div class="info-block">
                <div class="card-title-row"><span class="icon-box"><i class="bi bi-heart"></i></span><h2>Interests</h2></div>
                <div id="profileInterests"></div>
              </div>
              <div class="info-block">
                <div class="card-title-row"><span class="icon-box"><i class="bi bi-bullseye"></i></span><h2>Preferred roles</h2></div>
                <div id="profileRoles"></div>
              </div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="ph-card h-100">
              <div class="card-title-row"><span class="icon-box"><i class="bi bi-people"></i></span><h2>Teams</h2></div>
              <div id="profileTeams"></div>
            </div>
          </div>
        </div>

        <div class="text-end mt-4" id="dangerZone">
          <button class="btn btn-outline-danger" id="deleteAccountButton"><i class="bi bi-trash me-1"></i>Delete account</button>
        </div>
      </div>

      <!-- Edit form -->
      <div id="editSection" class="d-none">
        <div class="ph-card mx-auto" style="max-width: 720px;">
          <div class="card-title-row"><span class="icon-box"><i class="bi bi-pencil"></i></span><h2>Edit profile</h2></div>

          <form id="profileForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="fullName">Full name</label>
              <input type="text" class="form-control" id="fullName">
            </div>

            <div class="mb-3">
              <label class="form-label" for="emailField">Email address</label>
              <input type="email" class="form-control" id="emailField" disabled>
              <div class="form-text"><i class="bi bi-lock me-1"></i>Your email is used to log in and can't be changed.</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="skills">Skills</label>
              <input type="hidden" id="skills">
              <div class="form-text">Choose every skill you have.</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="interests">Interests <span class="fw-normal text-secondary">(optional)</span></label>
              <input type="hidden" id="interests">
              <div class="form-text">The kinds of teams and topics you like.</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="roles">Preferred roles</label>
              <input type="hidden" id="roles">
              <div class="form-text">The roles you like to take in a team.</div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-soft" id="cancelEditButton">Cancel</button>
              <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="ph-footer">
    <span>ProjectHub &copy; 2026</span>
    <a class="footer-email" href="mailto:projecthub@outlook.sa"><i class="bi bi-envelope"></i>projecthub@outlook.sa</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/profile.js"></script>
  <script>
    setupProfilePage();
  </script>
</body>
</html>
