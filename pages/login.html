<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | ProjectHub</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="auth-wrapper">
    <div class="auth-side">
      <h2>Welcome back.</h2>
      <p>Log in to see your team matches and the latest updates on your requests.</p>
      <img src="../images/hero-matching.svg" alt="">
    </div>
    <div class="auth-form">
      <div class="auth-box">
        <h1>Log in</h1>
        <p class="text-secondary">New to ProjectHub? <a href="register.html">Create an account</a></p>

        <form id="loginForm" class="mt-4" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" autocomplete="email">
          </div>

          <div class="mb-2">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" autocomplete="current-password">
              <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password" aria-label="Show password"><i class="bi bi-eye"></i></button>
            </div>
          </div>

          <div class="text-end mb-4">
            <a class="small" href="reset-password.html">Forgot your password?</a>
          </div>

          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    setupLoginPage();
  </script>
</body>
</html>
