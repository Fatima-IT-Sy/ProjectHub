<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit team | ProjectHub</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main id="pageContent">
    <div class="container">
      <div class="page-header">
        <h1>Edit team</h1>
        <p>Keep your team information up to date.</p>
      </div>
      <div class="ph-card mb-5" style="max-width: 760px;">
        <form id="teamForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="title">Team title</label>
            <input type="text" class="form-control" id="title" placeholder="e.g. Smart Campus App">
          </div>

          <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" rows="4" placeholder="What is the project or competition about, and what will the team build?"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label" for="type">Team type</label>
            <select class="form-select" id="type">
              <option value="">Choose a type</option>
              <option value="Hackathon">Hackathon</option>
              <option value="Competition">Competition</option>
              <option value="Practical Project">Practical Project</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label" for="skills">Required skills</label>
            <input type="hidden" id="skills">
            <div class="form-text">The skills your team still needs.</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="positions">Open positions</label>
            <input type="hidden" id="positions">
            <div class="form-text">The roles your team is looking for.</div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-soft" id="cancelLink" href="#">Cancel</a>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="ph-footer">
    <span>ProjectHub &copy; 2026</span>
    <a class="footer-email" href="mailto:projecthub@outlook.sa"><i class="bi bi-envelope"></i>projecthub@outlook.sa</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/teams.js"></script>
  <script>
    setupEditTeamPage();
  </script>
</body>
</html>
