<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete team | ProjectHub</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main id="pageContent">
    <div class="container py-5">
      <div class="ph-card mx-auto text-center" style="max-width: 520px;">
        <i class="bi bi-exclamation-triangle danger-icon"></i>
        <h1 class="h3 mt-3">Delete this team?</h1>
        <p class="mb-1">You are about to delete <strong id="teamName"></strong>.</p>
        <p class="meta" id="teamInfo"></p>
        <p class="text-secondary">The team and all of its join requests will be removed. This cannot be undone.</p>
        <div class="d-flex justify-content-center gap-2 mt-4">
          <a class="btn btn-soft" id="cancelLink" href="#">Cancel</a>
          <button class="btn btn-danger" id="confirmDeleteButton"><i class="bi bi-trash me-1"></i>Yes, delete team</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="ph-footer">
    <span>ProjectHub &copy; 2026</span>
    <a class="footer-email" href="mailto:projecthub@outlook.sa"><i class="bi bi-envelope"></i>projecthub@outlook.sa</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/teams.js"></script>
  <script>
    setupDeleteTeamPage();
  </script>
</body>
</html>
