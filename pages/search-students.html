<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search students | ProjectHub</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main>
    <div class="container">
      <div class="page-header">
        <h1>Search students</h1>
        <p>Find students by their skills or interests, or see who fits the team you created.</p>
      </div>

      <div class="ph-card mb-4">
        <form id="searchForm" class="row g-2" novalidate>
          <div class="col-lg-9">
            <input type="hidden" id="searchText">
            <div class="form-text">Choose one or more skills or interests.</div>
          </div>
          <div class="col-lg-3 d-grid align-self-start">
            <button type="submit" class="btn btn-primary">Search</button>
          </div>
        </form>
        <hr class="my-3">
        <div class="d-flex flex-wrap align-items-center gap-3">
          <button type="button" class="btn btn-gradient" id="matchButton" disabled><i class="bi bi-stars me-1"></i>Best matches for my team</button>
          <select class="form-select w-auto" id="teamSelect" aria-label="Choose your team" disabled><option>Choose your team</option></select>
          <span class="meta">Students whose skills fit the team you created.</span>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 m-0" id="resultsTitle"></h2>
        <span class="meta" id="resultsCount"></span>
      </div>
      <div class="row g-4 mb-5" id="results"></div>
    </div>
  </main>

  <footer class="ph-footer">
    <span>ProjectHub &copy; 2026</span>
    <a class="footer-email" href="mailto:projecthub@outlook.sa"><i class="bi bi-envelope"></i>projecthub@outlook.sa</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/search.js"></script>
  <script>
    setupSearchStudentsPage();
  </script>
</body>
</html>
