<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search teams | ProjectHub</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main>
    <div class="container">
      <div class="page-header">
        <h1>Search teams</h1>
        <p>Find a team by name, required skill, or type, or let us show the teams that match your skills.</p>
      </div>

      <div class="ph-card mb-4">
        <form id="searchForm" class="row g-2 align-items-center">
          <div class="col-lg-4">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control" id="searchText" placeholder="Team name" aria-label="Team name">
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <select class="form-select" id="searchSkill" aria-label="Required skill">
              <option value="">All skills</option>
            </select>
          </div>
          <div class="col-sm-6 col-lg-3">
            <select class="form-select" id="searchType" aria-label="Team type">
              <option value="">All types</option>
              <option value="Hackathon">Hackathon</option>
              <option value="Competition">Competition</option>
              <option value="Practical Project">Practical Project</option>
            </select>
          </div>
          <div class="col-lg-2 d-grid">
            <button type="submit" class="btn btn-primary">Search</button>
          </div>
        </form>
        <hr class="my-3">
        <div class="d-flex flex-wrap align-items-center gap-3">
          <button type="button" class="btn btn-gradient" id="matchButton"><i class="bi bi-stars me-1"></i>Best matches for me</button>
          <span class="meta">Teams that need the skills and roles in your profile.</span>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 m-0" id="resultsTitle"></h2>
        <span class="meta" id="resultsCount"></span>
      </div>
      <div class="row g-4 mb-5" id="results"></div>
    </div>
  </main>

  <footer class="ph-footer">
    <span>ProjectHub &copy; 2026</span>
    <a class="footer-email" href="mailto:projecthub@outlook.sa"><i class="bi bi-envelope"></i>projecthub@outlook.sa</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/search.js"></script>
  <script>
    setupSearchTeamsPage();
  </script>
</body>
</html>
