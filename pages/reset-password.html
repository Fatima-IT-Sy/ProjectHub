<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | ProjectHub</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="auth-wrapper">
    <div class="auth-side">
      <h2>Forgot your password?</h2>
      <p>It happens. Enter your email and set a new password in two quick steps.</p>
      <img src="../images/hero-matching.svg" alt="">
    </div>
    <div class="auth-form">
      <div class="auth-box">
        <div id="stepOne">
          <h1>Reset password</h1>
          <p class="text-secondary">Enter the email you used to create your account.</p>

          <form id="emailForm" class="mt-4" novalidate>
            <div class="mb-4">
              <label class="form-label" for="resetEmail">Email address</label>
              <input type="email" class="form-control" id="resetEmail" placeholder="name@example.com" autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary w-100">Send reset link</button>
          </form>
        </div>

        <div id="stepTwo" class="d-none">
          <h1>Set a new password</h1>
          <div class="alert alert-success d-flex gap-2 mt-3" role="alert">
            <i class="bi bi-envelope-check"></i>
            <span>A reset link was sent to <strong id="sentToEmail"></strong>.</span>
          </div>

          <form id="passwordForm" class="mt-3" novalidate>
            <div class="mb-3">
              <label class="form-label" for="newPassword">New password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="newPassword" autocomplete="new-password">
                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="newPassword" aria-label="Show password"><i class="bi bi-eye"></i></button>
              </div>
              <div class="form-text">At least 8 characters, with one number and one uppercase letter.</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="confirmNewPassword">Confirm new password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="confirmNewPassword" autocomplete="new-password">
                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirmNewPassword" aria-label="Show password"><i class="bi bi-eye"></i></button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Save new password</button>
          </form>
        </div>

        <p class="text-center mt-4 mb-0"><a href="login.html"><i class="bi bi-arrow-left me-1"></i>Back to log in</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    setupResetPage();
  </script>
</body>
</html>
