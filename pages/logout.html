<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log out | ProjectHub</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main id="pageContent">
    <div class="container py-5">
      <div class="ph-card mx-auto text-center" style="max-width: 480px;">
        <img class="modal-logo" src="../images/logo.png" alt="">

        <!-- Step 1: confirm -->
        <div id="logoutAsk">
          <h1 class="h3 mt-3">Are you sure you want to log out?</h1>
          <p class="text-secondary mb-0">You are logged in as <strong id="logoutName"></strong>. You can log in again anytime.</p>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button class="btn btn-soft" type="button" id="cancelLogout">Cancel</button>
            <button class="btn btn-primary" type="button" id="confirmLogout"><i class="bi bi-box-arrow-right me-1"></i>Log out</button>
          </div>
        </div>

        <!-- Step 2: done -->
        <div id="logoutDone" class="d-none" role="status">
          <h1 class="h3 mt-3">You have been logged out.</h1>
          <p class="text-secondary mb-0">See you soon on ProjectHub.</p>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <a class="btn btn-soft" href="../index.html">Home</a>
            <a class="btn btn-primary" id="loginAgain" href="login.html">Log in again</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="ph-footer">
    <span>ProjectHub &copy; 2026</span>
    <a class="footer-email" href="mailto:projecthub@outlook.sa"><i class="bi bi-envelope"></i>projecthub@outlook.sa</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    setupLogoutPage();
  </script>
</body>
</html>
